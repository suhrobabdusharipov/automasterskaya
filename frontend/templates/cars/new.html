{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="page-header">
        <h1>Новый автомобиль</h1>
        <a href="/cars" class="btn btn-secondary">Назад к списку</a>
    </div>

    {% if request.query_params.get("success") %}
    <div class="alert alert-success">
        Автомобиль успешно добавлен!
    </div>
    {% endif %}

    {% if request.query_params.get("error") %}
    <div class="alert alert-danger">
        Автомобиль с таким VIN уже существует!
    </div>
    {% endif %}

    <div class="form-container">
        <form action="/cars/new" method="post">
            <div class="form-group">
                <label>Марка</label>
                <input type="text" name="brand" required>
            </div>

            <div class="form-group">
                <label>Модель</label>
                <input type="text" name="model" required>
            </div>

            <div class="form-group">
                <label>Год выпуска</label>
                <input type="number" name="year" min="1900" max="{% now 'Y' %}" required>
            </div>

            <div class="form-group">
                <label>VIN номер</label>
                <input type="text" name="vin" required>
            </div>

            <div class="form-group">
                <label>Владелец</label>
                <select name="client_id">
                    <option value="">Выберите владельца</option>
                    {% for client in clients %}
                    <option value="{{ client.id }}">{{ client.full_name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Создать автомобиль</button>
                <a href="/cars" class="btn btn-secondary">Отмена</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
