{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="page-header">
        <h1>Новый договор</h1>
        <a href="/contracts" class="btn btn-secondary">Назад к списку</a>
    </div>

    {% if request.query_params.get("error") %}
    <div class="alert alert-danger">
        Ошибка: {{ request.query_params.get("error") }}
    </div>
    {% endif %}

    <div class="form-container">
        <form action="/contracts/new" method="post">
            <div class="form-section">
                <h2>Основная информация</h2>
                
                <div class="form-group">
                    <label>Клиент *</label>
                    <select name="client_id" required class="form-control">
                        <option value="">-- Выберите клиента --</option>
                        {% for client in clients %}
                        <option value="{{ client.id }}">{{ client.full_name }} ({{ client.phone }})</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label>Автомобиль *</label>
                    <select name="car_id" required class="form-control">
                        <option value="">-- Выберите автомобиль --</option>
                        {% for car in cars %}
                        <option value="{{ car.id }}">{{ car.brand }} {{ car.model }} ({{ car.year }}) - {{ car.vin }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label>Дата договора *</label>
                    <input type="date" name="date" required class="form-control" value="{{ today }}">
                </div>

                <div class="form-group">
                    <label>Статус</label>
                    <select name="status" class="form-control">
                        <option value="draft" selected>Черновик</option>
                        <option value="active">Активный</option>
                        <option value="completed">Завершен</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Сумма договора</label>
                    <input type="number" name="total_amount" step="0.01" min="0" value="0" class="form-control">
                </div>

                <div class="form-group">
                    <label>Описание</label>
                    <textarea name="description" rows="3" class="form-control" placeholder="Описание работ..."></textarea>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Создать договор</button>
                <a href="/contracts" class="btn btn-secondary">Отмена</a>
            </div>
        </form>
    </div>
</div>

<script>
// Простой скрипт для подстановки сегодняшней даты
document.addEventListener('DOMContentLoaded', function() {
    const dateInput = document.querySelector('input[name="date"]');
    if (dateInput && !dateInput.value) {
        const today = new Date().toISOString().split('T')[0];
        dateInput.value = today;
    }
});
</script>
{% endblock %}
