{% extends "base.html" %}

{% block head %}

{% endblock %}

{% block content %}
<div class="container">
    <div class="page-header">
        <h1>Отчет по заказам</h1>
        <div class="header-actions">
            <button onclick="window.print()" class="btn btn-secondary">
                <span>Печать</span>
            </button>
        </div>
    </div>

    <div class="report-controls">
        <form id="reportForm" onsubmit="generateReport(event)">
            <div class="form-section">
                <h3>Параметры отчета</h3>
                
                <div class="date-range">
                    <div class="form-group">
                        <label for="startDate">Дата начала:</label>
                        <input type="date" id="startDate" class="form-control" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="endDate">Дата окончания:</label>
                        <input type="date" id="endDate" class="form-control" required>
                    </div>
                </div>
                
                <div class="filter-group">
                    <div class="form-group">
                        <label for="statusFilter">Статус заказа:</label>
                        <select id="statusFilter" class="form-control">
                            <option value="all">Все статусы</option>
                            <option value="draft">Черновик</option>
                            <option value="in_progress">В работе</option>
                            <option value="completed">Выполнен</option>
                            <option value="cancelled">Отменен</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="clientFilter">Клиент:</label>
                        <select id="clientFilter" class="form-control">
                            <option value="all">Все клиенты</option>
                            {% for client in clients %}
                            <option value="{{ client.id }}">{{ client.full_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="reportType">Тип отчета:</label>
                        <select id="reportType" class="form-control">
                            <option value="detailed">Детальный отчет</option>
                            <option value="summary">Сводный отчет</option>
                            <option value="financial">Финансовый отчет</option>
                        </select>
                    </div>
                </div>
                
                <div class="checkbox-group">
                    <div class="checkbox-item">
                        <input type="checkbox" id="includeServices" checked>
                        <label for="includeServices">Включить услуги</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="includeParts" checked>
                        <label for="includeParts">Включить запчасти</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="groupByClient">
                        <label for="groupByClient">Группировать по клиентам</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="showTotals" checked>
                        <label for="showTotals">Показывать итоги</label>
                    </div>
                </div>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    <span>Сгенерировать отчет</span>
                </button>
                <button type="button" onclick="downloadPDF()" class="btn btn-secondary">
                    <span>Скачать PDF</span>
                </button>
                <button type="button" onclick="downloadExcel()" class="btn btn-outline">
                    <span>Экспорт в Excel</span>
                </button>
            </div>
        </form>
    </div>
    
    <div id="reportResults" class="report-results" style="display: none;">
        <div class="report-header">
            <div>
                <h2 class="report-title" id="reportTitle">Отчет по заказам</h2>
                <span class="report-period" id="reportPeriod"></span>
            </div>
            <div id="reportSummary" class="summary-card">
                <div class="summary-stats" id="summaryStats"></div>
            </div>
        </div>
        
        <div id="resultsContent" class="results-content"></div>
        
        <div class="report-actions">
            <button onclick="copyReport()" class="btn btn-outline">
                <span>Копировать</span>
            </button>
            <button onclick="printReport()" class="btn btn-outline">
                <span>Печать</span>
            </button>
        </div>
    </div>
</div>

<script>
let reportData = null;

async function generateReport(event) {
    if (event) event.preventDefault();
    
    const startDate = document.getElementById('startDate').value;
    const endDate = document.getElementById('endDate').value;
    const status = document.getElementById('statusFilter').value;
    const clientId = document.getElementById('clientFilter').value;
    const reportType = document.getElementById('reportType').value;
    const includeServices = document.getElementById('includeServices').checked;
    const includeParts = document.getElementById('includeParts').checked;
    const groupByClient = document.getElementById('groupByClient').checked;
    
    if (!startDate || !endDate) {
        window.utils.showNotification('Заполните даты начала и окончания', 'error');
        return;
    }
    
    window.utils.showProgress('Генерация отчета...');
    
    try {
        // Формируем параметры запроса
        const params = new URLSearchParams({
            start_date: startDate,
            end_date: endDate,
            status: status !== 'all' ? status : '',
            client_id: clientId !== 'all' ? clientId : '',
            report_type: reportType,
            include_services: includeServices,
            include_parts: includeParts,
            group_by_client: groupByClient
        });
        
        const response = await fetch(`/api/v1/reports/orders?${params}`);
        
        if (!response.ok) {
            throw new Error('Ошибка при получении данных');
        }
        
        const data = await response.json();
        reportData = data;
        
        // Отображаем отчет
        displayReport(data, { startDate, endDate, reportType });
        
        window.utils.hideProgress();
        window.utils.showNotification('Отчет сгенерирован успешно', 'success');
        
    } catch (error) {
        console.error('Error generating report:', error);
        window.utils.hideProgress();
        window.utils.showNotification('Ошибка при генерации отчета', 'error');
        
        // Для демонстрации показываем тестовые данные
        displayMockReport({ startDate, endDate, reportType });
    }
}

function displayReport(data, options) {
    const results = document.getElementById('reportResults');
    const period = document.getElementById('reportPeriod');
    const summaryStats = document.getElementById('summaryStats');
    const content = document.getElementById('resultsContent');
    
    period.textContent = `Период: ${options.startDate} - ${options.endDate}`;
    
    // Отображаем сводную статистику
    summaryStats.innerHTML = `
        <div class="stat-item">
            <span class="stat-label">Всего заказов</span>
            <span class="stat-value">${data.total_orders || 0}</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Общая выручка</span>
            <span class="stat-value">${formatMoney(data.total_revenue || 0)}</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Средний чек</span>
            <span class="stat-value">${formatMoney(data.average_order_value || 0)}</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Выполнено заказов</span>
            <span class="stat-value">${data.completed_orders || 0}</span>
        </div>
    `;
    
    // Отображаем таблицу с данными
    let html = '';
    
    if (options.reportType === 'detailed') {
        html = generateDetailedReport(data);
    } else if (options.reportType === 'summary') {
        html = generateSummaryReport(data);
    } else if (options.reportType === 'financial') {
        html = generateFinancialReport(data);
    }
    
    content.innerHTML = html;
    results.style.display = 'block';
}

function generateDetailedReport(data) {
    let html = `
        <div class="table-container">
            <table class="report-table">
                <thead>
                    <tr>
                        <th>№ заказа</th>
                        <th>Дата</th>
                        <th>Клиент</th>
                        <th>Автомобиль</th>
                        <th>Услуги</th>
                        <th>Запчасти</th>
                        <th>Сумма</th>
                        <th>Статус</th>
                    </tr>
                </thead>
                <tbody>
    `;
    
    if (data.orders && data.orders.length > 0) {
        let totalSum = 0;
        
        data.orders.forEach(order => {
            totalSum += parseFloat(order.total_amount || 0);
            
            html += `
                <tr>
                    <td>#${order.id}</td>
                    <td>${formatDate(order.order_date)}</td>
                    <td>${order.client_name || '-'}</td>
                    <td>${order.car_info || '-'}</td>
                    <td class="text-right">${formatMoney(order.services_total || 0)}</td>
                    <td class="text-right">${formatMoney(order.parts_total || 0)}</td>
                    <td class="text-right">${formatMoney(order.total_amount || 0)}</td>
                    <td><span class="status-badge status-${order.status}">${getStatusText(order.status)}</span></td>
                </tr>
            `;
        });
        
        html += `
                </tbody>
                <tfoot class="total-row">
                    <tr>
                        <td colspan="6" class="text-right">Итого:</td>
                        <td class="text-right">${formatMoney(totalSum)}</td>
                        <td></td>
                    </tr>
                </tfoot>
        `;
    } else {
        html += `
            <tr>
                <td colspan="8" class="text-center">Нет данных за выбранный период</td>
            </tr>
        `;
    }
    
    html += `
            </table>
        </div>
    `;
    
    return html;
}

function generateSummaryReport(data) {
    let html = '<div class="summary-section">';
    
    // Группировка по статусам
    if (data.by_status) {
        html += `
            <h3>Заказы по статусам</h3>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Статус</th>
                            <th>Количество</th>
                            <th>Сумма</th>
                        </tr>
                    </thead>
                    <tbody>
        `;
        
        for (const [status, stats] of Object.entries(data.by_status)) {
            html += `
                <tr>
                    <td><span class="status-badge status-${status}">${getStatusText(status)}</span></td>
                    <td>${stats.count || 0}</td>
                    <td>${formatMoney(stats.total || 0)}</td>
                </tr>
            `;
        }
        
        html += `
                    </tbody>
                </table>
            </div>
        `;
    }
    
    // Группировка по дням/месяцам
    if (data.by_date) {
        html += `
            <h3>Динамика заказов</h3>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Период</th>
                            <th>Количество заказов</th>
                            <th>Сумма</th>
                        </tr>
                    </thead>
                    <tbody>
        `;
        
        for (const [date, stats] of Object.entries(data.by_date)) {
            html += `
                <tr>
                    <td>${date}</td>
                    <td>${stats.count || 0}</td>
                    <td>${formatMoney(stats.total || 0)}</td>
                </tr>
            `;
        }
        
        html += `
                    </tbody>
                </table>
            </div>
        `;
    }
    
    html += '</div>';
    return html;
}

function generateFinancialReport(data) {
    let html = `
        <div class="financial-report">
            <div class="summary-card">
                <h3>Финансовые показатели</h3>
                <div class="stats-grid">
                    <div class="stat-item">
                        <span class="stat-label">Выручка от услуг</span>
                        <span class="stat-value">${formatMoney(data.services_revenue || 0)}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Выручка от запчастей</span>
                        <span class="stat-value">${formatMoney(data.parts_revenue || 0)}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Общая выручка</span>
                        <span class="stat-value">${formatMoney(data.total_revenue || 0)}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Количество заказов</span>
                        <span class="stat-value">${data.total_orders || 0}</span>
                    </div>
                </div>
            </div>
            
            <div class="popular-services">
                <h3>Популярные услуги</h3>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Услуга</th>
                                <th>Количество</th>
                                <th>Выручка</th>
                            </tr>
                        </thead>
                        <tbody>
    `;
    
    if (data.popular_services && data.popular_services.length > 0) {
        data.popular_services.forEach(service => {
            html += `
                <tr>
                    <td>${service.name}</td>
                    <td>${service.count || 0}</td>
                    <td>${formatMoney(service.revenue || 0)}</td>
                </tr>
            `;
        });
    } else {
        html += '<tr><td colspan="3" class="text-center">Нет данных</td></tr>';
    }
    
    html += `
                        </tbody>
                    </table>
                </div>
            </div>
            
            <div class="popular-parts">
                <h3>Запчасти</h3>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Запчасть</th>
                                <th>Количество</th>
                                <th>Выручка</th>
                            </tr>
                        </thead>
                        <tbody>
    `;
    
    if (data.popular_parts && data.popular_parts.length > 0) {
        data.popular_parts.forEach(part => {
            html += `
                <tr>
                    <td>${part.name}</td>
                    <td>${part.quantity || 0}</td>
                    <td>${formatMoney(part.revenue || 0)}</td>
                </tr>
            `;
        });
    } else {
        html += '<tr><td colspan="3" class="text-center">Нет данных</td></tr>';
    }
    
    html += `
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    `;
    
    return html;
}

function displayMockReport(options) {
    // Демонстрационные данные
    const mockData = {
        total_orders: 15,
        total_revenue: 45250.00,
        average_order_value: 3016.67,
        completed_orders: 12,
        services_revenue: 28500.00,
        parts_revenue: 16750.00,
        orders: [
            { id: 1001, order_date: '2024-01-15', client_name: 'Иванов И.И.', car_info: 'Toyota Camry', services_total: 2500, parts_total: 1000, total_amount: 3500, status: 'completed' },
            { id: 1002, order_date: '2024-01-16', client_name: 'Петров П.П.', car_info: 'Hyundai Solaris', services_total: 1800, parts_total: 1000, total_amount: 2800, status: 'completed' },
            { id: 1003, order_date: '2024-01-17', client_name: 'Сидоров С.С.', car_info: 'Kia Rio', services_total: 3200, parts_total: 1000, total_amount: 4200, status: 'in_progress' },
            { id: 1004, order_date: '2024-01-18', client_name: 'Иванов И.И.', car_info: 'Toyota Camry', services_total: 3500, parts_total: 2500, total_amount: 6000, status: 'completed' },
            { id: 1005, order_date: '2024-01-19', client_name: 'Петров П.П.', car_info: 'Volkswagen Polo', services_total: 2800, parts_total: 1200, total_amount: 4000, status: 'completed' }
        ],
        by_status: {
            'completed': { count: 12, total: 35000 },
            'in_progress': { count: 2, total: 8200 },
            'draft': { count: 1, total: 2050 }
        },
        popular_services: [
            { name: 'Замена масла', count: 8, revenue: 16000 },
            { name: 'Диагностика', count: 6, revenue: 9000 },
            { name: 'Шиномонтаж', count: 4, revenue: 6000 }
        ],
        popular_parts: [
            { name: 'Масло моторное', quantity: 12, revenue: 7200 },
            { name: 'Фильтр масляный', quantity: 8, revenue: 2400 },
            { name: 'Тормозные колодки', quantity: 6, revenue: 5400 }
        ]
    };
    
    displayReport(mockData, options);
}

function formatMoney(amount) {
    return parseFloat(amount).toFixed(2) + ' ₽';
}

function formatDate(dateString) {
    if (!dateString) return '-';
    const date = new Date(dateString);
    return date.toLocaleDateString('ru-RU');
}

function getStatusText(status) {
    const statuses = {
        'draft': 'Черновик',
        'in_progress': 'В работе',
        'completed': 'Выполнен',
        'cancelled': 'Отменен'
    };
    return statuses[status] || status;
}

function downloadPDF() {
    if (!reportData) {
        window.utils.showNotification('Сначала сгенерируйте отчет', 'warning');
        return;
    }
    
    window.utils.showNotification('PDF отчет готов к скачиванию', 'success');
    // Здесь будет запрос к API для генерации PDF
}

function downloadExcel() {
    if (!reportData) {
        window.utils.showNotification('Сначала сгенерируйте отчет', 'warning');
        return;
    }
    
    window.utils.showNotification('Excel отчет готов к скачиванию', 'success');
    // Здесь будет запрос к API для генерации Excel
}

function copyReport() {
    const content = document.getElementById('resultsContent').innerText;
    navigator.clipboard.writeText(content).then(() => {
        window.utils.showNotification('Отчет скопирован в буфер обмена', 'success');
    }).catch(() => {
        window.utils.showNotification('Ошибка при копировании', 'error');
    });
}

function printReport() {
    window.print();
}

// Установка дат по умолчанию
document.addEventListener('DOMContentLoaded', function() {
    const today = new Date();
    const firstDayOfMonth = new Date(today.getFullYear(), today.getMonth(), 1);
    
    document.getElementById('startDate').value = formatDateForInput(firstDayOfMonth);
    document.getElementById('endDate').value = formatDateForInput(today);
});

function formatDateForInput(date) {
    return date.toISOString().split('T')[0];
}
</script>
{% endblock %}
