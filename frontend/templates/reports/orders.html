{% extends "base.html" %}
{% block content %}
<div class="container">
    <div class="page-header">
        <h1>Отчет по заказам</h1>
    </div>

    <div class="form-container">
        <form id="reportForm">
            <div class="form-section">
                <h3>Параметры отчета</h3>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="startDate">Дата начала:</label>
                        <input type="date" id="startDate" class="form-control" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="endDate">Дата окончания:</label>
                        <input type="date" id="endDate" class="form-control" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="reportType">Тип отчета:</label>
                    <select id="reportType" class="form-control">
                        <option value="detailed">Детальный отчет</option>
                        <option value="summary">Сводный отчет</option>
                        <option value="financial">Финансовый отчет</option>
                    </select>
                </div>
                
                <div class="checkbox-group">
                    <div class="checkbox-item">
                        <input type="checkbox" id="includeServices" checked>
                        <label for="includeServices">Включить услуги</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="includeParts" checked>
                        <label for="includeParts">Включить запчасти</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="groupByClient">
                        <label for="groupByClient">Группировать по клиентам</label>
                    </div>
                </div>
            </div>
            
            <div class="form-actions">
                <button type="button" onclick="generateReport()" class="btn btn-primary">
                    <span>Сгенерировать отчет</span>
                </button>
                <button type="button" onclick="downloadReport()" class="btn btn-secondary">
                    <span>Скачать отчет(PDF)</span>
                </button>
            </div>
        </form>
        
        <div id="reportResults" class="report-results" style="display: none;">
            <h3>Результаты отчета</h3>
            <div class="results-content" id="resultsContent"></div>
        </div>
    </div>
</div>

<script>
function generateReport() {
    const startDate = document.getElementById('startDate').value;
    const endDate = document.getElementById('endDate').value;
    const reportType = document.getElementById('reportType').value;
    
    if (!startDate || !endDate) {
        window.utils.showNotification('Заполните даты начала и окончания', 'error');
        return;
    }
    
    window.utils.showProgress('Генерация отчета...');
    
    // Здесь будет запрос к API для генерации отчета
    setTimeout(() => {
        const results = document.getElementById('reportResults');
        const content = document.getElementById('resultsContent');
        
        // Пример данных
        content.innerHTML = `
            <div class="report-summary">
                <div class="summary-item">
                    <span class="label">Период:</span>
                    <span class="value">${startDate} - ${endDate}</span>
                </div>
                <div class="summary-item">
                    <span class="label">Количество заказов:</span>
                    <span class="value">15</span>
                </div>
                <div class="summary-item">
                    <span class="label">Общая выручка:</span>
                    <span class="value">45,250.00 ₽</span>
                </div>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID заказа</th>
                            <th>Дата</th>
                            <th>Клиент</th>
                            <th>Сумма</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr><td>1001</td><td>2024-01-15</td><td>Иванов И.И.</td><td>3,500.00 ₽</td></tr>
                        <tr><td>1002</td><td>2024-01-16</td><td>Петров П.П.</td><td>2,800.00 ₽</td></tr>
                        <tr><td>1003</td><td>2024-01-17</td><td>Сидоров С.С.</td><td>4,200.00 ₽</td></tr>
                    </tbody>
                </table>
            </div>
        `;
        
        results.style.display = 'block';
        window.utils.hideProgress();
        window.utils.showNotification('Отчет сгенерирован', 'success');
        
    }, 2000);
}

function downloadReport() {
    const startDate = document.getElementById('startDate').value;
    const endDate = document.getElementById('endDate').value;
    
    if (!startDate || !endDate) {
        window.utils.showNotification('Заполните даты начала и окончания', 'error');
        return;
    }
    
    window.utils.showProgress('Подготовка отчета для скачивания...');
    
    // Здесь будет запрос к API для скачивания PDF отчета
    setTimeout(() => {
        window.utils.hideProgress();
        window.utils.showNotification('Отчет готов к скачиванию', 'success');
        
        // Заглушка для демонстрации
        const url = `/api/v1/reports/generate?start_date=${startDate}&end_date=${endDate}`;
        window.utils.downloadFile(url);
    }, 1500);
}
</script>
{% endblock %}
