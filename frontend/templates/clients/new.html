{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="page-header">
        <h1>Новый клиент</h1>
        <a href="/clients" class="btn btn-secondary">Назад к списку</a>
    </div>

    {% if request.query_params.get("success") %}
    <div class="alert alert-success">
        Клиент успешно добавлен!
    </div>
    {% endif %}

    {% if request.query_params.get("error") %}
    <div class="alert alert-danger">
        Клиент с такой почтой или телефоном уже существует!
    </div>
    {% endif %}

    <div class="form-container">
        <form action="/clients/new" method="post">
            <div class="form-group">
                <label>ФИО</label>
                <input type="text" name="full_name" required>
            </div>

            <div class="form-group">
                <label>Телефон</label>
                <input type="text" name="phone" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email">
            </div>

            <div class="form-group">
                <label>Адрес</label>
                <input type="text" name="address">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Создать клиента</button>
                <a href="/clients" class="btn btn-secondary">Отмена</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
