{% extends "base.html" %}
{% block content %}
<div class="container">
    <div class="page-header">
        <h1>Клиенты</h1>
        <a href="/clients/new" class="btn btn-primary">
            <span>Добавить клиента</span>
        </a>
    </div>
    
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>ФИО</th>
                    <th>Телефон</th>
                    <th>Email</th>
                    <th>Адрес</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody>
                {% for client in clients %}
                <tr>
                    <td>{{ client.id }}</td>
                    <td>{{ client.full_name }}</td>
                    <td>{{ client.phone }}</td>
                    <td>{{ client.email }}</td>
                    <td>{{ client.address or '-' }}</td>
                    <td>
                        <div class="action-buttons">
                            <a href="/clients/{{ client.id }}" class="btn-small btn-view">
                                Просмотр
                            </a>
                            <a href="/clients/{{ client.id }}/edit" class="btn-small btn-edit">
                                Редактировать
                            </a>
                        </div>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
